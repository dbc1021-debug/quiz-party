<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主持畫面 · 搶答派對</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { overflow-x: hidden; }
  .stage { max-width: 1400px; margin: 0 auto; padding: 22px 28px 110px; min-height: 100vh; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .topbar h1 { font-size: 2rem; color: var(--primary); text-shadow: 0 3px 0 #fff; margin: 0; }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: rgba(255,255,255,.75); backdrop-filter: blur(6px); z-index: 20; }
  .pill { background: #fff; border-radius: 999px; padding: 8px 18px; font-weight: 900; box-shadow: var(--shadow); font-size: 1.1rem; }

  /* 大廳 */
  .lobby { display: grid; grid-template-columns: 420px 1fr; gap: 24px; align-items: start; }
  .qrbox { text-align: center; }
  .qrbox img.qr { width: 100%; max-width: 360px; border-radius: 18px; background: #fff; }
  .pin { font-size: 3.4rem; font-weight: 900; letter-spacing: .12em; color: var(--primary); line-height: 1.1; }
  .url { font-size: 1rem; word-break: break-all; opacity: .8; }
  .players { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; max-height: 62vh; overflow: auto; padding: 4px; }
  .chip { background: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 1.15rem; box-shadow: 0 4px 0 rgba(0,0,0,.08);
    cursor: pointer; animation: pop .4s both; }
  .chip:hover { background: #ffe0e0; text-decoration: line-through; }
  .chip.off { opacity: .45; }
  .count { font-size: 3rem; font-weight: 900; color: var(--primary); }

  /* 題目 */
  .qwrap { display: grid; grid-template-columns: 1fr 170px; gap: 22px; align-items: start; }
  .qtext { font-size: clamp(1.6rem, 3vw, 2.6rem); font-weight: 900; line-height: 1.45; }
  .qmeta { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; font-weight: 800; font-size: 1.15rem; }
  .qmeta .tag { font-size: 1rem; padding: 4px 14px; }
  .passage { font-size: 1.3rem; margin-bottom: 14px; max-height: 32vh; overflow: auto; }
  .clock { width: 160px; height: 160px; position: relative; }
  .clock svg { transform: rotate(-90deg); }
  .clock .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3.4rem; font-weight: 900; }
  .clock.warn .num { color: #ff4d6d; animation: pulse .5s infinite; }
  .answered { text-align: center; margin-top: 14px; font-weight: 900; font-size: 1.2rem; }
  .answered b { display: block; font-size: 2.6rem; color: var(--primary); }
  .hopts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .hopts .opt { font-size: clamp(1.2rem, 2.2vw, 1.8rem); min-height: 80px; cursor: default; }
  .hopts .opt .shape { width: 56px; height: 56px; font-size: 1.8rem; }
  .hopts .opt.correct { padding-right: 70px; }
  .hopts .opt .cnt { margin-left: auto; background: rgba(255,255,255,.3); border-radius: 12px; padding: 4px 12px; font-size: 1.2rem; }
  .typing-box { margin-top: 24px; font-size: 1.5rem; text-align: center; }
  .accepted { display: inline-block; background: #3fbf6a; color: #fff; border-radius: 16px; padding: 10px 22px; font-weight: 900; font-size: 1.8rem; margin: 6px; }
  .explain { margin-top: 16px; font-size: 1.25rem; }

  /* 排行 */
  .board { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 18px; padding: 14px 22px; font-size: 1.5rem; font-weight: 900;
    box-shadow: var(--shadow); animation: pop .45s both; }
  .row .rk { width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .fire { font-size: 1.1rem; }

  /* 頒獎台 */
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin: 10px auto 26px; max-width: 900px; }
  .pcol { flex: 1; max-width: 270px; display: flex; flex-direction: column; align-items: center; animation: rise .8s cubic-bezier(.2,1.2,.4,1) both; }
  .pcol .who { text-align: center; margin-bottom: 10px; }
  .pcol .medal { font-size: 4rem; line-height: 1; }
  .pcol .pname { font-size: 1.8rem; font-weight: 900; background: #fff; border-radius: 16px; padding: 6px 18px; margin-top: 6px; box-shadow: var(--shadow); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcol .pscore { font-weight: 900; font-size: 1.25rem; margin-top: 6px; }
  .block { width: 100%; border-radius: 22px 22px 6px 6px; display: grid; place-items: start center; padding-top: 14px; font-size: 3.6rem; font-weight: 900; color: #fff;
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.08), var(--shadow); }
  .p1 .block { height: 260px; background: linear-gradient(#ffd54d, #f5b800); }
  .p2 .block { height: 190px; background: linear-gradient(#dfe6ee, #b8c4d2); }
  .p3 .block { height: 140px; background: linear-gradient(#ffc08a, #e8904a); }
  .p1 { animation-delay: 1.4s; } .p2 { animation-delay: .7s; } .p3 { animation-delay: 0s; }
  .crown { font-size: 3rem; animation: bob 1.6s infinite; }
  @keyframes rise { from { transform: translateY(120%); opacity: 0; } to { transform: none; opacity: 1; } }
  .rest { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rest .row { font-size: 1.25rem; padding: 10px 18px; animation-delay: 2s; }
  .rest .row .rk { width: 40px; height: 40px; background: var(--accent); }

  .center { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  @media (max-width: 900px) { .lobby, .qwrap { grid-template-columns: 1fr; } .hopts, .rest { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <h1 id="title">搶答派對</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="pill" id="pin-pill"></span>
      <button class="btn ghost small" onclick="toggleFs()">⛶ 全螢幕</button>
    </div>
  </div>

  <section id="v-error" class="center hidden"><h2 id="err-msg"></h2><a class="btn" href="admin.html">回後台</a></section>

  <section id="v-lobby" class="hidden">
    <div class="lobby">
      <div class="card qrbox">
        <h2>📱 掃描加入</h2>
        <img class="qr" id="qr" alt="QR Code">
        <div style="margin-top:10px">或輸入代碼</div>
        <div class="pin" id="pin-big"></div>
        <div class="url" id="join-url"></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
          <img class="mascot" data-mascot src="img/mascot.svg" alt="" style="width:90px">
          <div><div class="count" id="count">0</div><div>位同學已加入（點名字可移除）</div></div>
        </div>
        <div class="players" id="players"></div>
      </div>
    </div>
  </section>

  <section id="v-question" class="hidden">
    <div class="qwrap">
      <div class="card">
        <div class="qmeta"><span id="q-num"></span><span class="tag" id="q-type"></span><span id="q-mode"></span></div>
        <div class="passage hidden" id="q-passage"></div>
        <div class="qtext" id="q-text"></div>
      </div>
      <div>
        <div class="clock" id="clock">
          <svg width="160" height="160" viewBox="0 0 160 160">
            <circle cx="80" cy="80" r="70" fill="#fff" stroke="rgba(0,0,0,.06)" stroke-width="14"/>
            <circle id="ring" cx="80" cy="80" r="70" fill="none" stroke="var(--primary)" stroke-width="14" stroke-linecap="round" stroke-dasharray="439.8" stroke-dashoffset="0"/>
          </svg>
          <div class="num" id="secs"></div>
        </div>
        <div class="answered card" style="padding:12px"><b id="ans-count">0</b>已作答 / <span id="ans-total">0</span></div>
      </div>
    </div>
    <div class="hopts" id="h-opts"></div>
    <div class="typing-box hidden card" id="h-typing">✏️ 請在手機上輸入答案</div>
    <div id="reveal-extra" class="hidden">
      <div class="card" style="margin-top:18px">
        <div id="rv-summary" style="font-size:1.4rem;font-weight:900"></div>
        <div id="rv-accepted"></div>
        <div id="rv-wrong" style="margin-top:8px;opacity:.75"></div>
        <div class="explain" id="rv-explain"></div>
      </div>
    </div>
  </section>

  <section id="v-leader" class="hidden">
    <h1 style="text-align:center;font-size:2.4rem;margin-bottom:18px">🏅 目前排行 <span id="lb-progress" style="font-size:1.2rem;opacity:.7"></span></h1>
    <div class="board" id="board"></div>
  </section>

  <section id="v-final" class="hidden">
    <h1 style="text-align:center;font-size:2.6rem">🎉 最終排名 🎉</h1>
    <div class="podium" id="podium"></div>
    <div class="rest" id="rest"></div>
  </section>
</div>

<div class="bottombar">
  <div id="status" style="font-weight:800"></div>
  <div style="display:flex;gap:10px">
    <button class="btn ghost hidden" id="btn-pause">⏸ 暫停自動</button>
    <button class="btn ghost hidden" id="btn-finish">提早結束</button>
    <button class="btn big" id="btn-next">開始遊戲 ▶</button>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="js/common.js"></script>
<script type="module" src="js/host.js"></script>
</body>
</html>
